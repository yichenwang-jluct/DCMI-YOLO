# Ultralytics YOLO, AGPL-3.0 license
# DCMI-YOLO paper (IEEE Access, under review): Table 3 row 3 (in-house) / Table 4 row 3 (iWildCam)
# + Star-ADown at the six stride-2 positions after the stem: 4 in the backbone, 2 in the bottom-up path (Section III-B).
# Expected model.info() at nc=17, 640x640: 2.67 M parameters, 7.5 GFLOPs (Table 3).
# For the iWildCam subset, nc is taken from data/iwildcam.yaml (nc=8).

nc: 17
scales: # all models in the paper use scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]               # 0   P1/2   stem stays Conv
  - [-1, 1, StarADown, [128]]               # 1   P2/4
  - [-1, 3, C2f, [128, True]]               # 2
  - [-1, 1, StarADown, [256]]               # 3   P3/8
  - [-1, 6, C2f, [256, True]]               # 4   <- P3
  - [-1, 1, StarADown, [512]]               # 5   P4/16
  - [-1, 6, C2f, [512, True]]               # 6   <- P4
  - [-1, 1, StarADown, [1024]]              # 7   P5/32
  - [-1, 3, C2f, [1024, True]]              # 8
  - [-1, 1, SPPF, [1024, 5]]                # 9   <- P5

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10
  - [[-1, 6], 1, Concat, [1]]               # 11  cat backbone P4
  - [-1, 3, C2f, [512]]                     # 12  top-down P4 (128 ch)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[-1, 4], 1, Concat, [1]]               # 14  cat backbone P3
  - [-1, 3, C2f, [256]]                     # 15  P3/8 output (64 ch)
  - [-1, 1, StarADown, [256]]               # 16  bottom-up P3->P4 (64 ch)
  - [[-1, 12], 1, Concat, [1]]              # 17  cat head P4
  - [-1, 3, C2f, [512]]                     # 18  P4/16 output (128 ch)
  - [-1, 1, StarADown, [512]]               # 19  bottom-up P4->P5 (128 ch)
  - [[-1, 9], 1, Concat, [1]]               # 20  cat SPPF (P5)
  - [-1, 3, C2f, [1024]]                    # 21  P5/32 output (256 ch)
  - [[15, 18, 21], 1, Detect, [nc]]         # 22  Detect(P3, P4, P5)
