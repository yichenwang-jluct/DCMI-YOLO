# Ultralytics YOLO, AGPL-3.0 license
# DCMI-YOLO paper (IEEE Access, under review): Table 3 row 4 (in-house) / Table 4 row 4 (iWildCam)
# + MultiSEAM at P3/P4/P5 with the P4/P5 outputs narrowed to 64 channels; trained with Repulsion Loss (Section III-C).
# Expected model.info() at nc=17, 640x640: 3.21 M parameters, 7.3 GFLOPs (Table 3).
# For the iWildCam subset, nc is taken from data/iwildcam.yaml (nc=8).

nc: 17
scales: # all models in the paper use scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]               # 0   P1/2   stem stays Conv
  - [-1, 1, Conv, [128, 3, 2]]              # 1   P2/4
  - [-1, 3, C2f, [128, True]]               # 2
  - [-1, 1, Conv, [256, 3, 2]]              # 3   P3/8
  - [-1, 6, C2f, [256, True]]               # 4   <- P3
  - [-1, 1, Conv, [512, 3, 2]]              # 5   P4/16
  - [-1, 6, C2f, [512, True]]               # 6   <- P4
  - [-1, 1, Conv, [1024, 3, 2]]             # 7   P5/32
  - [-1, 3, C2f, [1024, True]]              # 8
  - [-1, 1, SPPF, [1024, 5]]                # 9   <- P5

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10
  - [[-1, 6], 1, Concat, [1]]               # 11  cat backbone P4
  - [-1, 3, C2f, [512]]                     # 12  top-down P4 (128 ch)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[-1, 4], 1, Concat, [1]]               # 14  cat backbone P3
  - [-1, 3, C2f, [256]]                     # 15  P3/8 output (64 ch)
  - [-1, 1, MultiSEAM, []]                  # 16  P3/8: 64 ch, patch sizes (3, 5, 7)
  - [-1, 1, Conv, [256, 3, 2]]              # 17  bottom-up P3->P4 (64 ch)
  - [[-1, 12], 1, Concat, [1]]              # 18  cat head P4
  - [-1, 3, C2f, [256]]                     # 19  P4/16 output, narrowed to 64 ch (128 in YOLOv8n)
  - [-1, 1, MultiSEAM, []]                  # 20  P4/16: 64 ch, patch sizes (3, 5, 7)
  - [-1, 1, Conv, [512, 3, 2]]              # 21  bottom-up P4->P5 (128 ch)
  - [[-1, 9], 1, Concat, [1]]               # 22  cat SPPF (P5)
  - [-1, 3, C2f, [256]]                     # 23  P5/32 output, narrowed to 64 ch (256 in YOLOv8n)
  - [-1, 1, MultiSEAM, []]                  # 24  P5/32: 64 ch, patch sizes (3, 5, 7)
  - [[16, 20, 24], 1, Detect, [nc]]         # 25  Detect(P3, P4, P5)
