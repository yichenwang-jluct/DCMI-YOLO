# Ultralytics YOLO, AGPL-3.0 license
# DCMI-YOLO paper (IEEE Access, under review): Table 3 row 2 (in-house) / Table 4 row 2 (iWildCam)
# + SCI-Gamma low-light frontend (Section III-A).
# Expected model.info() at nc=17, 640x640: 3.13 M parameters, 8.4 GFLOPs (Table 3).
# For the iWildCam subset, nc is taken from data/iwildcam.yaml (nc=8).

nc: 17
scales: # all models in the paper use scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, SCIGamma, [3]]                  # 0   low-light frontend (Section III-A)
  - [-1, 1, Conv, [64, 3, 2]]               # 1   P1/2   stem stays Conv
  - [-1, 1, Conv, [128, 3, 2]]              # 2   P2/4
  - [-1, 3, C2f, [128, True]]               # 3
  - [-1, 1, Conv, [256, 3, 2]]              # 4   P3/8
  - [-1, 6, C2f, [256, True]]               # 5   <- P3
  - [-1, 1, Conv, [512, 3, 2]]              # 6   P4/16
  - [-1, 6, C2f, [512, True]]               # 7   <- P4
  - [-1, 1, Conv, [1024, 3, 2]]             # 8   P5/32
  - [-1, 3, C2f, [1024, True]]              # 9
  - [-1, 1, SPPF, [1024, 5]]                # 10  <- P5

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [[-1, 7], 1, Concat, [1]]               # 12  cat backbone P4
  - [-1, 3, C2f, [512]]                     # 13  top-down P4 (128 ch)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 14
  - [[-1, 5], 1, Concat, [1]]               # 15  cat backbone P3
  - [-1, 3, C2f, [256]]                     # 16  P3/8 output (64 ch)
  - [-1, 1, Conv, [256, 3, 2]]              # 17  bottom-up P3->P4 (64 ch)
  - [[-1, 13], 1, Concat, [1]]              # 18  cat head P4
  - [-1, 3, C2f, [512]]                     # 19  P4/16 output (128 ch)
  - [-1, 1, Conv, [512, 3, 2]]              # 20  bottom-up P4->P5 (128 ch)
  - [[-1, 10], 1, Concat, [1]]              # 21  cat SPPF (P5)
  - [-1, 3, C2f, [1024]]                    # 22  P5/32 output (256 ch)
  - [[16, 19, 22], 1, Detect, [nc]]         # 23  Detect(P3, P4, P5)
