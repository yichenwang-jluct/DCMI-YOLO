# Ultralytics YOLO, AGPL-3.0 license
# DCMI-YOLO paper (IEEE Access, under review): Table 3 row 7 and 8 (in-house) / Table 4 row 7 and 8 (iWildCam)
# Full DCMI-YOLO: SCI-Gamma + Star-ADown + MultiSEAM (with Repulsion Loss). Row 8 adds DF-CIoU, which is training-only.
# Expected model.info() at nc=17, 640x640: 2.99 M parameters, 6.9 GFLOPs (Table 3).
# For the iWildCam subset, nc is taken from data/iwildcam.yaml (nc=8).

nc: 17
scales: # all models in the paper use scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, SCIGamma, [3]]                  # 0   low-light frontend (Section III-A)
  - [-1, 1, Conv, [64, 3, 2]]               # 1   P1/2   stem stays Conv
  - [-1, 1, StarADown, [128]]               # 2   P2/4
  - [-1, 3, C2f, [128, True]]               # 3
  - [-1, 1, StarADown, [256]]               # 4   P3/8
  - [-1, 6, C2f, [256, True]]               # 5   <- P3
  - [-1, 1, StarADown, [512]]               # 6   P4/16
  - [-1, 6, C2f, [512, True]]               # 7   <- P4
  - [-1, 1, StarADown, [1024]]              # 8   P5/32
  - [-1, 3, C2f, [1024, True]]              # 9
  - [-1, 1, SPPF, [1024, 5]]                # 10  <- P5

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [[-1, 7], 1, Concat, [1]]               # 12  cat backbone P4
  - [-1, 3, C2f, [512]]                     # 13  top-down P4 (128 ch)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 14
  - [[-1, 5], 1, Concat, [1]]               # 15  cat backbone P3
  - [-1, 3, C2f, [256]]                     # 16  P3/8 output (64 ch)
  - [-1, 1, MultiSEAM, []]                  # 17  P3/8: 64 ch, patch sizes (3, 5, 7)
  - [-1, 1, StarADown, [256]]               # 18  bottom-up P3->P4 (64 ch)
  - [[-1, 13], 1, Concat, [1]]              # 19  cat head P4
  - [-1, 3, C2f, [256]]                     # 20  P4/16 output, narrowed to 64 ch (128 in YOLOv8n)
  - [-1, 1, MultiSEAM, []]                  # 21  P4/16: 64 ch, patch sizes (3, 5, 7)
  - [-1, 1, StarADown, [512]]               # 22  bottom-up P4->P5 (128 ch)
  - [[-1, 10], 1, Concat, [1]]              # 23  cat SPPF (P5)
  - [-1, 3, C2f, [256]]                     # 24  P5/32 output, narrowed to 64 ch (256 in YOLOv8n)
  - [-1, 1, MultiSEAM, []]                  # 25  P5/32: 64 ch, patch sizes (3, 5, 7)
  - [[17, 21, 25], 1, Detect, [nc]]         # 26  Detect(P3, P4, P5)
